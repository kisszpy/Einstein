<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstein</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300c29a'/%3E%3Ctext x='16' y='22.5' font-family='Segoe UI,Helvetica,sans-serif' font-size='17' font-weight='600' fill='%23ffffff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 首屏防闪烁：在渲染前同步应用主题
      (function () {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
