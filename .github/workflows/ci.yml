name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 语法检查
        working-directory: server
        run: python -m compileall -q app tools

      - name: 代码规范（ruff）
        working-directory: server
        run: python -m ruff check app tools tests

      - name: 单元测试（pytest）
        working-directory: server
        run: python -m pytest

      - name: 协议契约（每个后端都要实现完整）
        working-directory: server
        run: python tools/verify_contracts.py

      - name: 配置域三后端一致性（sqlite）
        working-directory: server
        run: python tools/verify_state_backends.py --only sqlite

      - name: API 文档是否与路由同步
        working-directory: server
        run: python tools/gen_api_doc.py --check

      - name: 启动服务并做契约冒烟
        working-directory: server
        env:
          APP_STORE_BACKEND: sqlite
          APP_LLM_BASE_URL: http://127.0.0.1:9/v1
          APP_EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1
          done
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python -c "import sys,json;print(json.load(sys.stdin)['token'])")
          test -n "$TOKEN"
          for path in /api/kb /api/experts /api/skills /api/workspaces /api/jobs/stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # 未带令牌必须 401，且不能泄漏堆栈
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/kb)
          test "$code" = "401"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: web
        run: npm run typecheck

      - name: 单元测试（vitest）
        working-directory: web
        run: npm test

      - name: 构建
        working-directory: web
        run: npm run build
